spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,com.wxmblog.base.common.config.RedissonAutoConfig

spring.cloud.nacos.discovery.enabled=false
spring.redis.open=false

logging.level.com.wxmblog.nostalgia=DEBUG
logging.level.org.springframework.jdbc=DEBUG